<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to My Flask Blog!</h1>
    {% for item in post %}
        <div class="post">
            <h2>{{item.get("title")}}</h2>
            <p><em>{{item.get("author")}}</em></p>
            <p>{{item.get("content")}}</p>
            <a href="{{ url_for('delete', post_id=item.get('id')) }}" class="delete">Delete Post</a>
        </div>
    {% endfor %}
    <a class="add_post" href="/add">Add Post</a>
</body>
</html>
